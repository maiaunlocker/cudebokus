<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O Cu de B0kus</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 3em;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.3);
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .controls {
            max-width: 900px;
            width: 100%;
            margin: 0 auto 20px;
        }

        .input-group {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 10px;
            color: #333;
            font-size: 14px;
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 14px 18px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #2a5298;
            box-shadow: 0 0 0 3px rgba(42, 82, 152, 0.1);
        }

        button {
            padding: 14px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(42, 82, 152, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .iframe-container {
            flex: 1;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            padding: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 100%;
            min-height: 600px;
            border: none;
            border-radius: 8px;
        }

        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            z-index: 1000;
            animation: slideIn 0.3s ease;
            display: none;
        }

        @keyframes slideIn {
            from { transform: translateX(400px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .toast.success { background: #28a745; }
        .toast.error { background: #dc3545; }
        .toast.warning { background: #ffc107; color: #333; }

        .proxy-status {
            margin-top: 15px;
            padding: 15px;
            border-radius: 8px;
            display: none;
            align-items: center;
            gap: 12px;
            font-weight: 600;
        }

        .proxy-status.show { display: flex; }
        .proxy-status.success { background: #d4edda; color: #155724; border: 2px solid #28a745; }
        .proxy-status.error { background: #f8d7da; color: #721c24; border: 2px solid #dc3545; }
        .proxy-status.loading { background: #d1ecf1; color: #0c5460; border: 2px solid #17a2b8; }

        @media (max-width: 768px) {
            .header h1 { font-size: 2em; }
            .input-wrapper { flex-direction: column; }
            button { width: 100%; }
            iframe { min-height: 400px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>O Cu de B0kus</h1>
    </div>

    <div class="controls">
        <div class="input-group" id="proxyGroup" style="display: none;">
            <label>🔧 Proxy</label>
            <div class="input-wrapper">
                <input id="proxy" type="text" placeholder="http://usuario:senha@IP:PORT">
                <button id="setProxy">Definir</button>
                <button id="clearProxy" style="background: #dc3545;">Limpar</button>
            </div>
            <div id="proxyStatus" class="proxy-status">
                <div class="status-icon" id="proxyIcon"></div>
                <div class="status-text">
                    <strong id="proxyStatusTitle"></strong>
                    <small id="proxyStatusMsg"></small>
                </div>
            </div>
        </div>

        <div class="input-group">
            <label>🌐 Endereço</label>
            <div class="input-wrapper">
                <input id="url" type="text" placeholder="https://exemplo.com">
                <button id="go">Ir</button>
                <button id="reload" style="background: #6c757d;">Recarregar</button>
            </div>
        </div>
    </div>

    <div class="iframe-container">
        <iframe id="frame"></iframe>
    </div>

    <div class="toast" id="toast"></div>

    <!-- Scripts do Ultraviolet -->
    <script src="/uv/uv.bundle.js"></script>
    <script src="/uv/uv.client.js"></script>
    <script src="/uv/uv.handler.js"></script>

    <script>
        // Inicializar o Ultraviolet
        const uv = new Ultraviolet({
            prefix: "/uv/service/",
            codec: Ultraviolet.codec.xor
        });

        const urlInput = document.getElementById("url");
        const iframe = document.getElementById("frame");
        const toast = document.getElementById("toast");

        function showToast(message, type = 'success') {
            toast.textContent = message;
            toast.className = `toast ${type}`;
            toast.style.display = 'block';
            setTimeout(() => {
                toast.style.display = 'none';
            }, 3000);
        }

        function abrirUrl() {
            const url = urlInput.value.trim();
            if (!url) {
                showToast("Digite uma URL!", "warning");
                return;
            }

            let finalUrl = url;
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                finalUrl = 'https://' + url;
            }

            try {
                const urlCodificada = uv.encodeUrl(finalUrl);
                iframe.src = urlCodificada;
                showToast("Carregando...", "success");
            } catch (err) {
                showToast("Erro ao codificar URL: " + err.message, "error");
            }
        }

        document.getElementById("go").addEventListener("click", abrirUrl);

        document.getElementById("reload").addEventListener("click", () => {
            if (iframe.src) {
                iframe.src = iframe.src;
                showToast("Recarregando...", "success");
            } else {
                showToast("Nenhuma página carregada", "warning");
            }
        });

        urlInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") abrirUrl();
        });
    </script>
</body>
</html>
