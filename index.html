<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O Cu de B0kus</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 15px;
            overflow-x: hidden;
        }

        /* ========== MATRIX CANVAS ========== */
        #matrix {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.18;
        }

        /* ========== CONTEÚDO SOBRE O MATRIX ========== */
        .content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* ========== HEADER ========== */
        .header {
            text-align: center;
            color: #00ff41;
            margin-bottom: 20px;
            padding: 15px;
        }

        .header h1 {
            font-size: 1.8em;
            text-shadow: 0 0 10px #00ff41, 0 0 20px #00ff41;
            letter-spacing: 3px;
            font-family: 'Courier New', monospace;
            animation: flicker 3s infinite;
        }

        @keyframes flicker {
            0%, 95%, 100% { opacity: 1; }
            96% { opacity: 0.7; }
            97% { opacity: 1; }
            98% { opacity: 0.5; }
            99% { opacity: 1; }
        }

        .header p {
            font-size: 0.75em;
            color: #00aa28;
            font-family: 'Courier New', monospace;
            margin-top: 5px;
            letter-spacing: 2px;
        }

        /* ========== CONTROLES ========== */
        .controls {
            width: 100%;
            max-width: 480px;
            margin: 0 auto 15px;
        }

        .input-group {
            background: rgba(0, 20, 0, 0.85);
            border: 1px solid #00ff41;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,255,65,0.2), inset 0 0 10px rgba(0,255,65,0.05);
            margin-bottom: 12px;
        }

        .input-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 10px;
            color: #00ff41;
            font-size: 12px;
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .input-wrapper {
            display: flex;
            gap: 8px;
            flex-direction: column;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            background: rgba(0, 10, 0, 0.9);
            border: 1px solid #00aa28;
            border-radius: 6px;
            font-size: 14px;
            color: #00ff41;
            font-family: 'Courier New', monospace;
            transition: all 0.3s;
            outline: none;
        }

        input[type="text"]::placeholder {
            color: #005510;
        }

        input[type="text"]:focus {
            border-color: #00ff41;
            box-shadow: 0 0 10px rgba(0,255,65,0.4);
        }

        .btn-row {
            display: flex;
            gap: 8px;
        }

        button {
            flex: 1;
            padding: 12px 10px;
            border: 1px solid #00ff41;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            background: rgba(0, 20, 0, 0.9);
            color: #00ff41;
            font-family: 'Courier New', monospace;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            background: rgba(0, 255, 65, 0.15);
            box-shadow: 0 0 15px rgba(0,255,65,0.4);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .btn-danger {
            border-color: #ff4141;
            color: #ff4141;
            background: rgba(20, 0, 0, 0.9);
        }

        .btn-danger:hover {
            background: rgba(255, 65, 65, 0.15);
            box-shadow: 0 0 15px rgba(255,65,65,0.4);
        }

        .btn-secondary {
            border-color: #888;
            color: #888;
        }

        .btn-secondary:hover {
            background: rgba(136,136,136,0.15);
            box-shadow: 0 0 15px rgba(136,136,136,0.3);
        }

        /* ========== STATUS DO PROXY ========== */
        .proxy-status {
            margin-top: 12px;
            padding: 12px;
            border-radius: 6px;
            display: none;
            align-items: center;
            gap: 10px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }

        .proxy-status.show { display: flex; }

        .proxy-status.success {
            background: rgba(0, 40, 0, 0.9);
            color: #00ff41;
            border: 1px solid #00ff41;
            box-shadow: 0 0 10px rgba(0,255,65,0.2);
        }

        .proxy-status.error {
            background: rgba(40, 0, 0, 0.9);
            color: #ff4141;
            border: 1px solid #ff4141;
            box-shadow: 0 0 10px rgba(255,65,65,0.2);
        }

        .proxy-status.loading {
            background: rgba(0, 20, 30, 0.9);
            color: #00aaff;
            border: 1px solid #00aaff;
            box-shadow: 0 0 10px rgba(0,170,255,0.2);
        }

        .status-text strong {
            display: block;
            margin-bottom: 3px;
            font-size: 13px;
        }

        .status-text small {
            opacity: 0.8;
            font-size: 11px;
            word-break: break-all;
        }

        /* ========== IFRAME ========== */
        .iframe-container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            background: rgba(0, 10, 0, 0.9);
            border: 1px solid #00ff41;
            border-radius: 8px;
            padding: 8px;
            box-shadow: 0 0 20px rgba(0,255,65,0.2);
            flex: 1;
        }

        .iframe-header {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid #003300;
        }

        .iframe-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .dot-red { background: #ff4141; }
        .dot-yellow { background: #ffcc00; }
        .dot-green { background: #00ff41; }

        .iframe-title {
            color: #005510;
            font-size: 11px;
            font-family: 'Courier New', monospace;
            margin-left: 4px;
        }

        iframe {
            width: 100%;
            height: 500px;
            border: none;
            border-radius: 4px;
            background: #fff;
        }

        /* ========== TOAST ========== */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 25px;
            border-radius: 6px;
            color: white;
            font-weight: 600;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            z-index: 1000;
            display: none;
            white-space: nowrap;
            animation: slideUp 0.3s ease;
            letter-spacing: 1px;
        }

        @keyframes slideUp {
            from { transform: translateX(-50%) translateY(40px); opacity: 0; }
            to { transform: translateX(-50%) translateY(0); opacity: 1; }
        }

        .toast.success { background: rgba(0,80,0,0.95); border: 1px solid #00ff41; color: #00ff41; }
        .toast.error { background: rgba(80,0,0,0.95); border: 1px solid #ff4141; color: #ff4141; }
        .toast.warning { background: rgba(80,60,0,0.95); border: 1px solid #ffcc00; color: #ffcc00; }

        /* ========== SPINNER ========== */
        .spinner {
            border: 2px solid rgba(0,170,255,0.3);
            border-top: 2px solid #00aaff;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            animation: spin 1s linear infinite;
            display: inline-block;
            flex-shrink: 0;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<!-- CANVAS DO MATRIX -->
<canvas id="matrix"></canvas>

<div class="content">
    <!-- HEADER -->
    <div class="header">
        <h1>[ O Cu de B0kus ]</h1>
        <p>&gt; PROXY SYSTEM ONLINE_</p>
    </div>

    <!-- CONTROLES -->
    <div class="controls">

        <!-- PROXY -->
        <div class="input-group">
            <label>[ PROXY UPSTREAM ]</label>
            <div class="input-wrapper">
                <input id="proxy" type="text" placeholder="http://user:pass@IP:PORT">
                <div class="btn-row">
                    <button id="setProxy"><span id="setProxyText">DEFINIR</span></button>
                    <button id="clearProxy" class="btn-danger">LIMPAR</button>
                </div>
            </div>
            <div id="proxyStatus" class="proxy-status">
                <div id="proxyIcon"></div>
                <div class="status-text">
                    <strong id="proxyStatusTitle"></strong>
                    <small id="proxyStatusMsg"></small>
                </div>
            </div>
        </div>

        <!-- URL -->
        <div class="input-group">
            <label>[ ENDEREÇO ]</label>
            <div class="input-wrapper">
                <input id="url" type="text" placeholder="https://exemplo.com">
                <div class="btn-row">
                    <button id="go">ACESSAR</button>
                    <button id="reload" class="btn-secondary">RELOAD</button>
                </div>
            </div>
        </div>

    </div>

    <!-- IFRAME -->
    <div class="iframe-container">
        <div class="iframe-header">
            <div class="iframe-dot dot-red"></div>
            <div class="iframe-dot dot-yellow"></div>
            <div class="iframe-dot dot-green"></div>
            <span class="iframe-title">NAVEGADOR SEGURO</span>
        </div>
        <iframe id="frame"></iframe>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    // ==================== MATRIX ====================
    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const fontSize = 14;
    const columns = Math.floor(canvas.width / fontSize);
    const drops = Array(columns).fill(1);

    function drawMatrix() {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#00ff41';
        ctx.font = fontSize + 'px Courier New';

        for (let i = 0; i < drops.length; i++) {
            const text = Math.random() > 0.5 ? '1' : '0';
            ctx.fillStyle = drops[i] * fontSize < 20 ? '#ffffff' : '#00ff41';
            ctx.fillText(text, i * fontSize, drops[i] * fontSize);

            if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                drops[i] = 0;
            }
            drops[i]++;
        }
    }

    setInterval(drawMatrix, 50);

    window.addEventListener('resize', () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    });

    // ==================== PROXY LOGIC ====================
    const proxyInput = document.getElementById("proxy");
    const urlInput = document.getElementById("url");
    const iframe = document.getElementById("frame");
    const toast = document.getElementById("toast");
    const proxyStatus = document.getElementById("proxyStatus");
    const proxyIcon = document.getElementById("proxyIcon");
    const proxyStatusTitle = document.getElementById("proxyStatusTitle");
    const proxyStatusMsg = document.getElementById("proxyStatusMsg");
    const setProxyBtn = document.getElementById("setProxy");
    const setProxyText = document.getElementById("setProxyText");
    let currentUrl = null;

    function showToast(message, type = 'success') {
        toast.textContent = message;
        toast.className = `toast ${type}`;
        toast.style.display = 'block';
        setTimeout(() => { toast.style.display = 'none'; }, 3000);
    }

    function showProxyStatus(type, title, message) {
        proxyStatus.className = `proxy-status show ${type}`;
        proxyStatusTitle.textContent = title;
        proxyStatusMsg.textContent = message;
        if (type === 'success') proxyIcon.innerHTML = '✅';
        else if (type === 'error') proxyIcon.innerHTML = '❌';
        else if (type === 'loading') proxyIcon.innerHTML = '<div class="spinner"></div>';
    }

    // CONFIGURAR PROXY
    document.getElementById("setProxy").addEventListener("click", async () => {
        const proxy = proxyInput.value.trim();
        if (!proxy) { showToast("INSIRA UM PROXY VÁLIDO", "warning"); return; }

        setProxyBtn.disabled = true;
        setProxyText.textContent = "VERIFICANDO...";
        showProxyStatus('loading', 'VERIFICANDO PROXY', 'Testando conexão...');

        try {
            const res = await fetch("/set-proxy", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ proxy })
            });
            const data = await res.json();
            await new Promise(r => setTimeout(r, 500));

            if (data.success) {
                showProxyStatus('success', '>> PROXY APROVADO', `Status: ${data.status || '200'} | Online`);
                showToast("PROXY ATIVADO COM SUCESSO", "success");
                localStorage.setItem('savedProxy', proxy);
            } else {
                showProxyStatus('error', '>> PROXY RECUSADO', `${data.error || 'Falha na conexão'}`);
                showToast("PROXY INVÁLIDO OU OFFLINE", "warning");
            }
        } catch (err) {
            showProxyStatus('error', '>> ERRO DE CONEXÃO', err.message);
            showToast("ERRO: " + err.message, "error");
        } finally {
            setProxyBtn.disabled = false;
            setProxyText.textContent = "DEFINIR";
        }
    });

    // LIMPAR PROXY
    document.getElementById("clearProxy").addEventListener("click", async () => {
        proxyInput.value = "";
        proxyStatus.classList.remove('show');
        await fetch("/set-proxy", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ proxy: "" })
        });
        showToast("PROXY REMOVIDO", "success");
        localStorage.removeItem('savedProxy');
    });

    // NAVEGAR
    function abrirUrl() {
        const url = urlInput.value.trim();
        if (!url) { showToast("INSIRA UMA URL", "warning"); return; }

        let finalUrl = url;
        if (!url.startsWith('http://') && !url.startsWith('https://')) {
            finalUrl = 'https://' + url;
        }

        currentUrl = finalUrl;
        iframe.src = "/proxy?url=" + encodeURIComponent(finalUrl);
        showToast("CARREGANDO...", "success");
    }

    document.getElementById("go").addEventListener("click", abrirUrl);
    urlInput.addEventListener("keypress", (e) => { if (e.key === "Enter") abrirUrl(); });

    // RECARREGAR
    document.getElementById("reload").addEventListener("click", () => {
        if (currentUrl) {
            iframe.src = "/proxy?url=" + encodeURIComponent(currentUrl);
            showToast("RECARREGANDO...", "success");
        } else {
            showToast("NENHUMA PÁGINA CARREGADA", "warning");
        }
    });

    // RESTAURAR PROXY SALVO
    const savedProxy = localStorage.getItem('savedProxy');
    if (savedProxy) proxyInput.value = savedProxy;
</script>
</body>
</html>
