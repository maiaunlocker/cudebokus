<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O Cu de B0kus</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 3em;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.3);
            letter-spacing: 2px;
        }

        .controls {
            max-width: 900px;
            width: 100%;
            margin: 0 auto 20px;
        }

        .input-group {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 10px;
            color: #333;
            font-size: 14px;
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        input[type="text"] {
            flex: 1;
            min-width: 250px;
            padding: 14px 18px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #2a5298;
            box-shadow: 0 0 0 3px rgba(42,82,152,0.1);
        }

        button {
            padding: 14px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(42,82,152,0.4);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .proxy-status {
            margin-top: 15px;
            padding: 15px;
            border-radius: 8px;
            display: none;
            align-items: center;
            gap: 12px;
            font-weight: 600;
        }

        .proxy-status.show { display: flex; }
        .proxy-status.success { background: #d4edda; color: #155724; border: 2px solid #28a745; }
        .proxy-status.error { background: #f8d7da; color: #721c24; border: 2px solid #dc3545; }
        .proxy-status.loading { background: #d1ecf1; color: #0c5460; border: 2px solid #17a2b8; }

        .iframe-container {
            flex: 1;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            padding: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 100%;
            min-height: 600px;
            border: none;
            border-radius: 8px;
        }

        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            z-index: 1000;
            display: none;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { transform: translateX(400px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .toast.success { background: #28a745; }
        .toast.error { background: #dc3545; }
        .toast.warning { background: #ffc107; color: #333; }

        .spinner {
            border: 3px solid rgba(23,162,184,0.3);
            border-top: 3px solid #17a2b8;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .header h1 { font-size: 2em; }
            .input-wrapper { flex-direction: column; }
            button { width: 100%; }
            iframe { min-height: 400px; }
        }
    </style>
</head>
<body>

<div class="header">
    <h1>O Cu de B0kus</h1>
</div>

<div class="controls">
    <div class="input-group">
        <label>🔧 Proxy Upstream</label>
        <div class="input-wrapper">
            <input id="proxy" type="text" placeholder="http://user:pass@IP:PORT ou socks5://IP:PORT">
            <button id="setProxy"><span id="setProxyText">Definir</span></button>
            <button id="clearProxy" style="background:#dc3545;">Limpar</button>
        </div>
        <div id="proxyStatus" class="proxy-status">
            <div id="proxyIcon"></div>
            <div>
                <strong id="proxyStatusTitle"></strong>
                <small id="proxyStatusMsg" style="display:block;"></small>
            </div>
        </div>
    </div>

    <div class="input-group">
        <label>🌐 Endereço</label>
        <div class="input-wrapper">
            <input id="url" type="text" placeholder="https://exemplo.com">
            <button id="go">Ir</button>
            <button id="reload" style="background:#6c757d;">Recarregar</button>
        </div>
    </div>
</div>

<div class="iframe-container">
    <iframe id="frame"></iframe>
</div>

<div class="toast" id="toast"></div>

<script>
    const proxyInput = document.getElementById("proxy");
    const urlInput = document.getElementById("url");
    const iframe = document.getElementById("frame");
    const toast = document.getElementById("toast");
    const proxyStatus = document.getElementById("proxyStatus");
    const proxyIcon = document.getElementById("proxyIcon");
    const proxyStatusTitle = document.getElementById("proxyStatusTitle");
    const proxyStatusMsg = document.getElementById("proxyStatusMsg");
    const setProxyBtn = document.getElementById("setProxy");
    const setProxyText = document.getElementById("setProxyText");
    let currentUrl = null;

    function showToast(message, type = 'success') {
        toast.textContent = message;
        toast.className = `toast ${type}`;
        toast.style.display = 'block';
        setTimeout(() => { toast.style.display = 'none'; }, 3000);
    }

    function showProxyStatus(type, title, message) {
        proxyStatus.className = `proxy-status show ${type}`;
        proxyStatusTitle.textContent = title;
        proxyStatusMsg.textContent = message;
        if (type === 'success') proxyIcon.innerHTML = '✅';
        else if (type === 'error') proxyIcon.innerHTML = '❌';
        else if (type === 'loading') proxyIcon.innerHTML = '<div class="spinner"></div>';
    }

    // ========== CONFIGURAR PROXY ==========
    document.getElementById("setProxy").addEventListener("click", async () => {
        const proxy = proxyInput.value.trim();
        if (!proxy) { showToast("Digite um proxy válido", "warning"); return; }

        setProxyBtn.disabled = true;
        setProxyText.textContent = "Verificando...";
        showProxyStatus('loading', 'Verificando Proxy', 'Testando conexão...');

        try {
            const res = await fetch("/set-proxy", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ proxy })
            });
            const data = await res.json();
            await new Promise(r => setTimeout(r, 500));

            if (data.success) {
                showProxyStatus('success', '✅ Proxy Aprovado!', `Status: ${data.status || '200'}`);
                showToast("✅ Proxy configurado!", "success");
                localStorage.setItem('savedProxy', proxy);
            } else {
                showProxyStatus('error', '❌ Proxy Recusado', `Erro: ${data.error || 'inválido'}`);
                showToast("⚠️ Proxy não validado", "warning");
            }
        } catch (err) {
            showProxyStatus('error', '❌ Erro', err.message);
            showToast("❌ Erro: " + err.message, "error");
        } finally {
            setProxyBtn.disabled = false;
            setProxyText.textContent = "Definir";
        }
    });

    // ========== LIMPAR PROXY ==========
    document.getElementById("clearProxy").addEventListener("click", async () => {
        proxyInput.value = "";
        proxyStatus.classList.remove('show');
        await fetch("/set-proxy", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ proxy: "" })
        });
        showToast("✅ Proxy removido", "success");
        localStorage.removeItem('savedProxy');
    });

    // ========== NAVEGAR ==========
    function abrirUrl() {
        const url = urlInput.value.trim();
        if (!url) { showToast("Digite uma URL!", "warning"); return; }

        let finalUrl = url;
        if (!url.startsWith('http://') && !url.startsWith('https://')) {
            finalUrl = 'https://' + url;
        }

        currentUrl = finalUrl;
        iframe.src = "/proxy?url=" + encodeURIComponent(finalUrl);
        showToast("⏳ Carregando...", "success");
    }

    document.getElementById("go").addEventListener("click", abrirUrl);
    urlInput.addEventListener("keypress", (e) => { if (e.key === "Enter") abrirUrl(); });

    // ========== RECARREGAR ==========
    document.getElementById("reload").addEventListener("click", () => {
        if (currentUrl) {
            iframe.src = "/proxy?url=" + encodeURIComponent(currentUrl);
            showToast("🔄 Recarregando...", "success");
        } else {
            showToast("Nenhuma página carregada", "warning");
        }
    });

    // ========== RESTAURAR PROXY SALVO ==========
    const savedProxy = localStorage.getItem('savedProxy');
    if (savedProxy) proxyInput.value = savedProxy;
</script>
</body>
</html>
